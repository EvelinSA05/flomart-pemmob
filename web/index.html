      height: 100vh;

    }
    .loader {
      border: 4px solid #f3f3f3;

      width: 40px;
      height: 40px;
      -webkit-animation: spin 1s linear infinite; /* Safari */

      0% { transform: rotate(0deg); }

    }
    .loading-text {
      margin-top: 20px;
      color: #555;
      font-size: 14px;
    }
